    <h1 align="center">LETS CONNECT</h1>

    <br><br>

    <table width="80%" align="center" border="0" cellpadding="10" cellspacing="0">
        <tr valign="top">
           
            <td width="45%">
                <br><br>
                <ul type="square">
                    <li>
                        <p><b>Email</b></p>
                    </li>
                    
                    <br>
                    <li>
                        <p><b>LinkedIn</b></p>
                    </li>
                    <br>
                    <li>
                        <p><b>Instagram</b></p>
                    </li>
                </ul>
            </td>

            
            <td width="10%"></td>

            <td width="45%">
                <form action="#" method="post">
                    <table border="1" cellpadding="8" cellspacing="0" width="100%">
                        <tr>
                            <td>
                                <label for="nama">YOUR NAME</label><br>
                                <input type="text" id="nama" name="nama" style="width: 95%;" required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="email">EMAIL ADDRESS</label><br>
                                <input type="email" id="email" name="email" style="width: 95%;" required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="telepon">TELEPHONE NUMBER</label><br>
                                <input type="tel" id="telepon" name="telepon" style="width: 95%;" required>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="pesan">YOUR MESSAGE</label><br>
                                <textarea id="pesan" name="pesan" rows="4" style="width: 95%;" required></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td align="left">
                                <button type="submit">SEND MESSAGE</button>
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>
